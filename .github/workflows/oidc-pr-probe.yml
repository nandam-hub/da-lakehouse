name: oidc-pr-probe
on:
  pull_request:
  push:
    branches: [ oidc-i312 ]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet boto3
      - run: python3 probe.py
